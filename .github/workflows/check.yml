name: Windows package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and check conversation isolation
        shell: powershell
        run: |
          .\build.ps1
          .\tests\run-projects.ps1
          .\tests\run-bridge.ps1
          .\tests\run-gui.ps1
          .\tests\run-approval-gui.ps1
          python .\tests\test_vscode_projects.py
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
      - name: Check a fresh installation
        shell: powershell
        run: |
          .\scripts\download-dependencies.ps1
          .\tests\run-package.ps1 -DependencyCache "$pwd\.cache"
      - name: Build distributable package
        shell: powershell
        run: .\scripts\build-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: codex-vscode-jokebear-windows-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
